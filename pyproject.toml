[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "forgelab"
dynamic = ["version"]
description = "The LLVM of design — a universal JSON design interchange format and compiler for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ForgeLab Contributors" }]
keywords = ["design", "compiler", "intermediate-representation", "cad", "eda", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Compilers",
]
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.110",
]

[project.optional-dependencies]
agent = ["anthropic>=0.40"]
preview = ["matplotlib>=3.7", "numpy>=1.24"]
api = ["uvicorn>=0.27"]
auth = ["pyjwt>=2.8", "cryptography>=42", "python-multipart>=0.0.9"]
# 2.x, not 1.x: the server was migrated off the removed mcp.server.fastmcp.
# The <3 bound is ordinary caution about the next major, not a workaround.
#
# pyjwt is declared here, not only under [auth], because every MCP tool calls
# require_scope -> forgelab.mcp.auth_bridge -> forgelab.auth, which imports jwt
# at module scope. Until this line existed the stdio server started only
# because the MCP SDK happened to depend on pyjwt itself; the day it stops,
# every fresh install would die at import. `cryptography` stays in [auth] —
# PyJWT reaches for it lazily, and only RS256/JWKS verification needs it.
mcp = ["mcp>=2.1,<3", "pyjwt>=2.8"]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  # Exact pins, on purpose. A checker whose output is a gate and whose rules
  # change by design gets pinned; a library gets a range. Unpinned, a ruff or
  # pyright release turns main red with no commit behind it — which is what
  # happened twice on 2026-09-06 (ruff 0.16 began formatting Markdown code
  # blocks, pyright 1.1.411 stopped narrowing a getattr on a discriminated
  # union). It also cuts the other way: this box was two ruff minors behind CI,
  # so the local gates were not the gates that mattered. The weekly
  # tooling-drift workflow reports new releases so these move deliberately.
  "ruff==0.16.6",
  "pyright==1.1.411",
  "pyjwt>=2.8",
  "cryptography>=42",
  "python-multipart>=0.0.9",
  "mcp>=2.1,<3",  # see the [mcp] extra above
  "matplotlib>=3.7",
  "numpy>=1.24",
  "gerbonara>=1.1",
]

[project.urls]
Homepage = "https://github.com/andresparraarze/ForgeLab"
Repository = "https://github.com/andresparraarze/ForgeLab"

[project.scripts]
forgelab = "forgelab.cli:main"
forgelab-mcp = "forgelab.mcp.__main__:main"

# The version comes from git, not from a literal here. A static version is
# the same string on every commit, so nothing downstream can tell two builds
# apart: `forgelab update` could not report what changed, and pip 23.x (which
# only reinstalls a git URL when the version differs) left users on a stale
# commit forever. Deriving it means every commit builds a distinct, ordered
# version carrying its own sha — 0.1.1.dev47+g3919e7e.
#
# fallback-version covers a build with no git metadata (a source tarball);
# the repo has no tags yet, and hatch-vcs handles that on its own.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.hatch.build.targets.wheel]
packages = ["forgelab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# ruff 0.16 began formatting Python code blocks inside Markdown. The only
# Markdown in this repo carrying Python blocks is docs/superpowers/ — the dated
# spec and plan documents for work already shipped. Those are a record of what
# was proposed at the time, not living source, so rewriting their snippets is
# both noise and a small falsification of the archive.
#
# Scoped to that directory rather than all Markdown: a snippet added to
# README.md or CHANGELOG.md should be held to the same standard as the code it
# documents, and a blanket **/*.md would exempt it silently.
exclude = ["docs/superpowers/**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pyright]
include = ["forgelab"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
