name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # Never cancel the other interpreters when one fails: the whole point of
      # the matrix is telling version-specific breakage apart from a general
      # one, and a cancelled sibling job reports nothing.
      fail-fast: false
      matrix:
        # Every version pyproject's requires-python (>=3.11) promises. 3.13/3.14
        # are here because float summation, dict/set behaviour and repr have all
        # changed between minors before; testing only the oldest two let a
        # 3.11-only failure reach main from a 3.14 dev machine.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"
      # Each step calls scripts/check.sh, which is where the command actually
      # lives, so CI and a developer's machine cannot run different checks. The
      # steps stay separate for readable failure reporting in the UI.
      - name: Ruff lint
        run: scripts/check.sh lint
      - name: Ruff format
        run: scripts/check.sh format
      - name: Pyright
        run: scripts/check.sh types
      - name: Pytest
        run: scripts/check.sh tests
      # Near a no-op here — this job has neither FreeCAD nor kicad-cli — but it
      # keeps the flag itself covered, and it is the gate that matters locally.
      # The `hardware` job below is where the KiCad-backed tests actually run.
      - name: Pytest (external tools hidden)
        run: scripts/check.sh tests-bare

  # A real install, because none of the above performs one. Every defect this
  # catches was invisible to the suite: an MCP registration scoped to the
  # install directory, an extra the installer forgot so two of the 40 tools
  # failed on clean machines only, and a git-URL install that does not move
  # when the source does. One interpreter is enough — the matrix above covers
  # the library; this covers the packaging.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version is derived from git, and the upgrade check installs
          # HEAD~1 before HEAD, so a shallow clone would fail both.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify install
        run: scripts/verify-install.sh

  # The KiCad-backed tests, on the one runner that has KiCad. Everything above
  # skips them, which is how ForgeLab shipped boards KiCad reported 23 mismatched
  # footprints and two shorts on: the suite called kicad-cli "ground truth" and
  # then never had it installed anywhere it ran. Its own job because installing
  # KiCad costs a couple of minutes and the matrix should not pay that four
  # times over.
  hardware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install KiCad
        run: |
          # From KiCad's own PPA, not the distro: Ubuntu 24.04 ships 7.0, whose
          # footprint libraries predate the current pin naming (a USB-B's shells
          # are 5 and 6 there, "SH" from 9 onward) and whose footprints spell the
          # designator as fp_text. ForgeLab handles both spellings and degrades
          # to synthesized copper for a footprint it cannot find — there are
          # tests for each — but the version CI exercises should be the version
          # the component library's footprint names are written against.
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          # kicad-cli runs the DRC; the footprint libraries are what the
          # exporter embeds. Neither is any use here without the other.
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints
          kicad-cli version
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"
      - name: Pytest
        run: scripts/check.sh tests
